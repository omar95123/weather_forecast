name: weather_forecast
description: "Weather Forecast - search any city and see current conditions and a 5-day forecast."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.0.0

  # Bloc
  bloc:
  flutter_bloc: ^9.1.1

  # Connections
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^7.0.0

  # Local storage (recent-search cache)
  shared_preferences: ^2.3.3

  # Tools
  intl: ^0.20.2
  collection: ^1.19.1
  equatable: ^2.0.7
  fluttertoast: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mockito: ^5.4.0

flutter:
  generate: false
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
